<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoDi — Legal</title>
<style>
  :root { --ink:#1a1a1a; --beige:#c9a87c; --muted:#6b6b6b; --line:#eceae6; --bg:#faf9f7; }
  body { margin:0; background:var(--bg); color:var(--ink); min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  .card { text-align:center; padding:40px 32px; }
  .logo { display:inline-block; background:var(--ink); color:var(--beige);
    font-weight:700; font-size:28px; padding:10px 20px; border-radius:14px; letter-spacing:.5px; }
  h1 { font-size:22px; margin:22px 0 4px; }
  p { color:var(--muted); margin:0 0 28px; }
  a { display:inline-block; margin:6px; padding:12px 22px; border-radius:10px;
    text-decoration:none; font-weight:600; }
  .primary { background:var(--ink); color:#fff; }
  .ghost { border:1px solid var(--line); color:var(--ink); background:#fff; }
</style>
</head>
<body>
  <div class="card">
    <span class="logo">Co</span>
    <h1>CoDi — Fashion AI</h1>
    <p>Legal documents</p>
    <div>
      <a class="primary" href="privacy.html">Privacy Policy</a>
      <a class="ghost" href="terms.html">Terms of Service</a>
    </div>
  </div>
</body>
</html>
